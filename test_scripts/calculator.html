<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: rgb(45, 45, 45);
        }

        .calculator {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-width: 300px;
            margin: auto;
        }

        .calculator input {
            grid-column: span 4;
            font-size: 24px;
            padding: 10px;
            text-align: right;
        }

        .calculator button {
            font-size: 24px;
            padding: 10px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 15px;
            background-color: #7a7b7b;
        }

        .calculator button.operator {
            background-color: #006aff;
            color: white;
        }

        #result {
            margin-top: 20px;
            font-size: 24px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    
    <div class="calculator">
        <input type="text" id="result" readonly>
        <button>(</button>
        <button>)</button>
        <button>C</button>
        <button class="operator">⌫</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">/</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">*</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">-</button>
        <button>0</button>
        <button>.</button>
        <button class="operator">=</button>
        <button class="operator">+</button>
    </div>

    <script>
        //===================================
        //   Safe arithmetic evaluator (no eval)
        //   Grammar:
        //     expression = term   (('+' | '-') term)*
        //     term       = unary  (('*' | '/') unary)*
        //     unary      = ('+' | '-') unary | power
        //     power      = primary ('**' unary)?        (right-associative)
        //     primary    = number | '(' expression ')'
        function evaluate(expression) {
            const NUMBER = /^(\d+\.?\d*|\.\d+)$/;
            const tokens = expression.match(/\d+\.?\d*|\.\d+|\*\*|[-+*/()]|\S/g) || [];
            let pos = 0;

            const peek = () => tokens[pos];
            const next = () => tokens[pos++];

            function parseExpression() {
                let value = parseTerm();
                while (peek() === '+' || peek() === '-') {
                    value = next() === '+' ? value + parseTerm() : value - parseTerm();
                }
                return value;
            }

            function parseTerm() {
                let value = parseUnary();
                while (peek() === '*' || peek() === '/') {
                    value = next() === '*' ? value * parseUnary() : value / parseUnary();
                }
                return value;
            }

            function parseUnary() {
                if (peek() === '-') { next(); return -parseUnary(); }
                if (peek() === '+') { next(); return parseUnary(); }
                return parsePower();
            }

            function parsePower() {
                const base = parsePrimary();
                if (peek() === '**') { next(); return base ** parseUnary(); }
                return base;
            }

            function parsePrimary() {
                const token = next();
                if (token === '(') {
                    const value = parseExpression();
                    if (next() !== ')') throw new SyntaxError('Missing closing parenthesis');
                    return value;
                }
                if (token !== undefined && NUMBER.test(token)) return parseFloat(token);
                throw new SyntaxError('Unexpected input');
            }

            const value = parseExpression();
            if (pos < tokens.length) throw new SyntaxError('Unexpected input');
            return value;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const result = document.getElementById('result');
            const buttons = document.querySelectorAll('.calculator button');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    // Start fresh after an error message
                    if (result.value === 'Error') {
                        result.value = '';
                    }

                    if (button.textContent === '=') {
                        if (result.value.trim() !== '') {
                            try {
                                result.value = evaluate(result.value);
                            } catch (e) {
                                result.value = 'Error';
                            }
                        }
                    } else if (button.textContent === 'C') {
                        result.value = '';
                    } else if (button.textContent === '⌫') {
                        result.value = result.value.slice(0, -1);
                    } else {
                        result.value += button.textContent;
                    }
                });
            });
        });
    </script>

</body>
</html>
