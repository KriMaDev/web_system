services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-krima_rep}
      DB_USER: ${DB_USER:-km_app}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      APP_FORCE_SECURE_COOKIES: ${APP_FORCE_SECURE_COOKIES:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-krima_rep}
      MYSQL_USER: ${DB_USER:-km_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root}
    volumes:
      - db_data:/var/lib/mysql
      # Runs automatically the first time the (empty) data volume is initialised
      - ./helpers/database/krima_rep.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # TCP ping only succeeds once the real server is up (not the init-time one)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
